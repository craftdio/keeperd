name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The production Vite build exceeds Node's default ~2 GB heap on the
      # hosted Ubuntu runner. Keep this explicit so the PR and release paths
      # validate the same build rather than failing before KeepERD checks run.
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
    
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096 --localstorage-file=${{ runner.temp }}/chartdb-localstorage
        run: npm run test:ci

      - name: Run KeepERD CLI tests
        run: npm run local:test:cli

      - name: Build KeepERD local app
        run: npm run local:build

      - name: Create KeepERD release bundle
        run: npm run keeperd:bundle -- --output-directory=release

      - name: Verify KeepERD release checksum
        working-directory: release
        run: sha256sum --check keeperd-v*.tar.gz.sha256

      - name: Smoke-test and inspect extracted KeepERD release
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < KEEPERD_VERSION)"
          ARCHIVE="release/keeperd-v${VERSION}.tar.gz"
          EXTRACT_DIR="$(mktemp -d)"
          trap 'rm -rf "${EXTRACT_DIR}"' EXIT

          CONTENTS="$(tar -tzf "${ARCHIVE}")"
          for REQUIRED in \
            bin/keeperd.mjs \
            dist/index.html \
            tools/local-erd/server.mjs \
            tools/local-erd/stop.mjs \
            tools/local-erd/stop-control.mjs \
            tools/local-erd/open-browser.mjs \
            package.json \
            package-lock.json \
            KEEPERD_VERSION \
            LICENSE \
            NOTICE
          do
            grep -Fxq "keeperd-v${VERSION}/${REQUIRED}" <<< "${CONTENTS}"
          done
          if grep -E '/(node_modules|\.git|\.local-erd)(/|$)|\.test\.(mjs|js)$' <<< "${CONTENTS}"; then
            echo 'Release archive contains a forbidden path.' >&2
            exit 1
          fi

          tar -xzf "${ARCHIVE}" -C "${EXTRACT_DIR}"
          BUNDLE="${EXTRACT_DIR}/keeperd-v${VERSION}"
          test "$(node "${BUNDLE}/bin/keeperd.mjs" --version)" = "KeepERD ${VERSION}"
          node "${BUNDLE}/bin/keeperd.mjs" --help | grep -Fq 'keeperd <command> [options]'
